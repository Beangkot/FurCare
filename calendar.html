<!DOCTYPE html>
<!-- ============================================================
  FurCare — Calendar Page
  The monthly calendar grid and all reminder lists are generated
  by js/script.js (renderCalendar / renderReminderList).
  ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track appointments, vaccinations and feeding schedules with the FurCare calendar.">
  <title>FurCare · Calendar</title>

  <!-- Google Fonts: Poppins (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Local stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar is rendered dynamically by script.js -->
  <header></header>

  <main>
    <!-- ============ PAGE HEADER ============ -->
    <div class="page-header">
      <div class="container">
        <span class="section-eyebrow">Stay On Track</span>
        <h1>Calendar</h1>
        <p>Every appointment, vaccination and feeding time — in one friendly view.</p>
      </div>
    </div>

    <section class="section" aria-label="Calendar and reminders">
      <div class="container">
        <div class="calendar-layout">

          <!-- ============ MONTHLY CALENDAR ============ -->
          <div class="card calendar-card reveal">
            <div class="calendar-header">
              <h3 id="calendarMonthLabel">Month</h3>
              <div class="calendar-nav">
                <button id="prevMonthBtn" aria-label="Previous month">
                  <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="nextMonthBtn" aria-label="Next month">
                  <i class="fa-solid fa-chevron-right"></i>
                </button>
              </div>
            </div>

            <!-- Weekday labels -->
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Sun</span>
              <span>Mon</span>
              <span>Tue</span>
              <span>Wed</span>
              <span>Thu</span>
              <span>Fri</span>
              <span>Sat</span>
            </div>

            <!-- Days injected by renderCalendar() -->
            <div class="calendar-days" id="calendarDays"></div>
          </div>

          <!-- ============ SIDE REMINDER PANELS ============ -->
          <aside aria-label="Reminders">
            <div class="reminder-section">
              <h3><i class="fa-solid fa-calendar-check"></i> Upcoming Appointments</h3>
              <div id="upcomingList"></div>
            </div>

            <div class="reminder-section">
              <h3><i class="fa-solid fa-syringe"></i> Vaccination Reminders</h3>
              <div id="vaccinationList"></div>
            </div>

            <div class="reminder-section">
              <h3><i class="fa-solid fa-bowl-food"></i> Feeding Reminders</h3>
              <div id="feedingList"></div>
            </div>
          </aside>

        </div>
      </div>
    </section>
  </main>

  <!-- Footer is rendered dynamically by script.js -->
  <footer></footer>

  <!-- Application script -->
  <script src="js/script.js"></script>
</body>
</html>
