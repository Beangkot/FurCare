<!DOCTYPE html>
<!-- ============================================================
  FurCare — My Pets Page
  Pet cards, search bar and filter buttons are all rendered
  dynamically by js/script.js (renderPetToolbar / renderPetCards).
  ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your pets' health records, weight and status with FurCare.">
  <title>FurCare · My Pets</title>

  <!-- Google Fonts: Poppins (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Local stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar is rendered dynamically by script.js -->
  <header></header>

  <main>
    <!-- ============ PAGE HEADER ============ -->
    <div class="page-header">
      <div class="container">
        <span class="section-eyebrow">Your Family</span>
        <h1>My Pets</h1>
        <p>Keep track of every furry friend — from health records to daily reminders.</p>
      </div>
    </div>

    <section class="section" aria-label="Pets list">
      <div class="container">
        <!-- Search bar + filter buttons injected by renderPetToolbar() -->
        <div class="pets-toolbar" id="petsToolbar"></div>

        <!-- Pet cards injected by renderPetCards() -->
        <div class="grid grid-3" id="petsGrid"></div>
      </div>
    </section>
  </main>

  <!-- Footer is rendered dynamically by script.js -->
  <footer></footer>

  <!-- Application script -->
  <script src="js/script.js"></script>
</body>
</html>
