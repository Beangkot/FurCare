<!DOCTYPE html>
<!-- ============================================================
  FurCare — Alerts Page
  Summary cards and alert cards are generated dynamically by
  js/script.js (renderAlertSummary / renderAlertCards).
  ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View medication, vaccination and appointment alerts for your pets.">
  <title>FurCare · Alerts</title>

  <!-- Google Fonts: Poppins (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Local stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar is rendered dynamically by script.js -->
  <header></header>

  <main>
    <!-- ============ PAGE HEADER ============ -->
    <div class="page-header">
      <div class="container">
        <span class="section-eyebrow">Never Miss a Thing</span>
        <h1>Alerts</h1>
        <p>Medication, vaccination and appointment reminders for all your pets.</p>
      </div>
    </div>

    <section class="section" aria-label="Alerts overview">
      <div class="container">

        <!-- Summary cards injected by renderAlertSummary() -->
        <div class="alerts-summary" id="alertsSummary"></div>

        <!-- Alert cards injected by renderAlertCards() -->
        <div id="alertsList"></div>

      </div>
    </section>
  </main>

  <!-- Footer is rendered dynamically by script.js -->
  <footer></footer>

  <!-- Application script -->
  <script src="js/script.js"></script>
</body>
</html>
